[project]
name = "roster"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["projects/server"]

[tool.uv.sources]
roster-server = { workspace = true }

[dependency-groups]
dev = [
    "roster-server",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["projects/server/tests"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["config", "domain", "adapters", "api", "runs", "cli"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["projects/server/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
